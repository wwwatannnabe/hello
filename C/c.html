<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C言語 学習ガイド</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>C言語 学習ガイド</h1>
      <p>知りたい項目・今のレベルに合わせて選んでください</p>
    </header>

    <!-- Lv.1 -->
    <section class="level-section">
      <div class="level-header">
        <span class="badge lv1">Lv.1 入門</span>
        <h2>プログラムの基本部品</h2>
      </div>
      <div class="card-grid">
        <a href="pages/lv1_variable.html" class="card">
          <h3>変数とデータ型</h3>
          <p>値を入れる「箱」の作り方と種類</p>
        </a>
        <a href="pages/lv1_if.html" class="card">
          <h3>条件分岐（if / switch）</h3>
          <p>条件によって処理を分ける</p>
        </a>
      </div>
    </section>

    <!-- Lv.2 -->
    <section class="level-section">
      <div class="level-header">
        <span class="badge lv2">Lv.2 基礎</span>
        <h2>処理の流れを操る</h2>
      </div>
      <div class="card-grid">
        <a href="pages/lv2_for.html" class="card">
          <h3>for文（繰り返し）</h3>
          <p>決まった回数だけ処理を繰り返す</p>
        </a>
        <a href="pages/lv2_while.html" class="card">
          <h3>while文（繰り返し）</h3>
          <p>条件を満たすあいだ繰り返す</p>
        </a>
        <a href="pages/lv2_array.html" class="card">
          <h3>配列</h3>
          <p>同じ型のデータを並べて管理する</p>
        </a>
      </div>
    </section>

    <!-- Lv.3 -->
    <section class="level-section">
      <div class="level-header">
        <span class="badge lv3">Lv.3 応用</span>
        <h2>C言語の核心・整理術</h2>
      </div>
      <div class="card-grid">
        <a href="pages/lv3_function.html" class="card">
          <h3>関数</h3>
          <p>処理を部品として切り出す</p>
        </a>
        <a href="pages/lv3_pointer.html" class="card">
          <h3>ポインタ</h3>
          <p>メモリの「住所」を直接扱う</p>
        </a>
        <a href="pages/lv3_struct.html" class="card">
          <h3>構造体</h3>
          <p>異なるデータを1つにまとめる</p>
        </a>
      </div>
    </section>
  </div>
</body>
</html>
